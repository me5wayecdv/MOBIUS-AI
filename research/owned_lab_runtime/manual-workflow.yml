    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transfer and publication gate
        run: |
          echo 'HELD: exact signed APK transfer/audience, supervisor and runtime approval unresolved'
          exit 1
# No boot/install commands are included until all gates are reviewed.
