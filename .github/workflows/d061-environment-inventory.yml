name: Environment inventory
on:
  push:
    branches: [d061-owned-android-contained-preparation]
    paths: [.github/workflows/d061-environment-inventory.yml]
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          def cmd(args):
              try:
                  r = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=10, check=False)
                  if r.returncode != 0 or len(r.stdout)>262144: return None
                  return r.stdout.decode('utf-8', 'replace').strip()
              except (OSError, subprocess.TimeoutExpired): return None
          release={}
          for line in Path('/etc/os-release').read_text().splitlines():
              k,_,v=line.partition('=')
              if k in ('ID','VERSION_ID'): release[k]=v.strip('"')
          m=re.search(r'^MemTotal:\s+(\d+) kB$',Path('/proc/meminfo').read_text(),re.M)
          disk=os.statvfs('/')
          versions=cmd(['docker','version','--format','{{json .}}'])
          try:
              v=json.loads(versions) if versions else {}
              dv={k:(v.get(k) or {}).get('Version') for k in ('Client','Server')}
          except (ValueError,TypeError,AttributeError): dv=None
          ids=cmd(['docker','image','ls','--no-trunc','--quiet'])
          images=None
          if ids is not None:
              unique=sorted(set(ids.splitlines()))
              images={'count':len(unique),'truncated':len(unique)>16,'items':[]}
              for iid in unique[:16]:
                  if re.fullmatch(r'sha256:[0-9a-f]{64}',iid) is None: continue
                  raw=cmd(['docker','image','inspect','--format','{{json .}}',iid])
                  try:
                      obj=json.loads(raw) if raw else {}
                      # Registry/repository names are NOT emitted. Digest hashes and sizes only.
                      digests=sorted(set(x.rsplit('@',1)[-1] for x in (obj.get('RepoDigests') or []) if re.fullmatch(r'.+@sha256:[0-9a-f]{64}',x)))
                      images['items'].append({'id':iid,'digests':digests[:4],'bytes':obj.get('Size') if type(obj.get('Size')) is int else None})
                  except (ValueError,TypeError,AttributeError): images['items'].append({'id':iid,'unreadable':True})
          paths=['/proc/self/ns/pid','/proc/self/ns/mnt','/proc/self/ns/net','/proc/self/cgroup','/sys/fs/cgroup/cgroup.controllers','/sys/fs/cgroup/cgroup.subtree_control','/sys/fs/cgroup/cgroup.events']
          readable={}
          for p in paths:
              try:
                  fd=os.open(p,os.O_RDONLY|os.O_CLOEXEC|os.O_NONBLOCK);os.close(fd);readable[p]=True
              except OSError: readable[p]=False
          # Closed output allowlist: never env dumps, source, paths outside the fixed list, process lists, network, credentials or file contents.
          result={'os':release,'runner_image_version':os.environ.get('ImageVersion') if re.fullmatch(r'[0-9.]{1,40}',os.environ.get('ImageVersion','')) else None,
                  'docker':dv,'memory_total_bytes':int(m.group(1))*1024 if m else None,'disk_available_bytes':disk.f_bavail*disk.f_frsize,
                  'images':images,'fixed_files_readable':readable}
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PY
