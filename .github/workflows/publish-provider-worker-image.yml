name: Manual-only publish isolated provider-analysis worker image

on:
  workflow_dispatch:
    inputs:
      owner_approval:
        description: "Type APPROVED only after explicit project-owner approval to publish this image."
        required: true
        type: string
      approval_reference:
        description: "Reference or short note recording the project-owner decision."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.owner_approval == 'APPROVED' && inputs.approval_reference != '' }}
    name: Publish approved provider-analysis image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (manual workflow only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/provider-image/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mobius-provider:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MOBIUS isolated provider-exposure analyzer

      - name: Smoke test the published image by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mobius-provider
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/provider-image-smoke"
          mkdir -p "$smoke_root"
          chmod 0777 "$smoke_root"
          python - <<'PY'
          import os, zipfile
          apk_path = os.path.join(os.environ["RUNNER_TEMP"], "provider-image-smoke", "input.apk")
          manifest = (
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example">'
              "<application>"
              "<provider android:name='.NotesProvider' android:authorities='com.example.notes' "
              "android:exported='true'/>"
              "</application></manifest>"
          )
          with zipfile.ZipFile(apk_path, "w") as apk:
              apk.writestr("AndroidManifest.xml", manifest)
              with open("tests/fixtures/dex/AnalysisTest.dex", "rb") as fixture:
                  apk.writestr("classes.dex", fixture.read())
          PY
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --pids-limit 128 --memory 4096m --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --mount "type=bind,src=$smoke_root,dst=/work" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            mobius-provider-analysis --input /work/input.apk \
            > "$smoke_root/result.json"
          python - <<'PY'
          import hashlib, json, os
          root = os.path.join(os.environ["RUNNER_TEMP"], "provider-image-smoke")
          with open(os.path.join(root, "result.json"), "rb") as fh:
              payload = json.load(fh)
          with open(os.path.join(root, "input.apk"), "rb") as fh:
              digest = hashlib.sha256(fh.read()).hexdigest()
          assert payload["schema_version"] == 1, payload.get("schema_version")
          assert payload["artifact_sha256"] == digest, "payload not bound to the staged APK"
          assert payload["package_name"] == "com.example"
          providers = [e["provider"] for e in payload["exposures"]]
          assert any(p.endswith("NotesProvider") for p in providers), providers
          assert payload["dex_coverage"][0]["status"] == "parsed"
          print("provider image smoke OK:", providers)
          PY
          {
            echo "### Published provider-analysis worker image"
            echo
            echo "Owner approval reference: ${{ inputs.approval_reference }}"
            echo
            printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
