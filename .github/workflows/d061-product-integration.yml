# HELD outside .github/workflows. Does not register or automatically execute.
name: D061 product local integration and isolated TLS rejection
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact consolidated source SHA, separately reviewed before activation
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: d061-product-local-integration
  cancel-in-progress: false
jobs:
  held-product-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      D061_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      PRODUCT_ROOT: /opt/d061-product-${{ github.run_id }}-${{ github.run_attempt }}
      TLS_ROOT: /opt/d061-tls-${{ github.run_id }}-${{ github.run_attempt }}
      CONTROL: ${{ github.workspace }}/.d061-product-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: Exact source gate and independent workflow launch intent
        run: |
          python - <<'PY'
          import ast,json,os,re,subprocess
          from pathlib import Path
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          expected=os.environ['D061_REVIEWED_SHA']
          if not re.fullmatch('[0-9a-f]{40}',expected) or expected!=actual:raise SystemExit('exact SHA mismatch')
          source=Path('research/d061_native/stage_product.py')
          assignments={target.id:node.value.value for node in ast.parse(source.read_text()).body
            if isinstance(node,ast.Assign) and isinstance(node.value,ast.Constant)
            for target in node.targets if isinstance(target,ast.Name)}
          if assignments.get('APPROVED_FOR_EXECUTION') is not True:raise SystemExit('consolidated workflow still HELD')
          control=Path(os.environ['CONTROL']);control.mkdir(mode=0o700,exist_ok=False)
          (control/'workflow-intent.json').write_text(json.dumps({'reviewed_sha':actual,
            'product_root':os.environ['PRODUCT_ROOT'],'tls_root':os.environ['TLS_ROOT'],
            'product_launch_expected':False,'tls_launch_expected':False},sort_keys=True))
          PY
          sudo mkdir -m700 "$PRODUCT_ROOT" "$TLS_ROOT"
      - name: Install product test tooling only, no model tooling or APK execution
        run: python -m pip install -e '.[dev]'
      - name: Retrieve one fixed genuine historical artifact, no provider request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/me5wayecdv/MOBIUS-AI/actions/artifacts/14691009604/zip > "$CONTROL/historical.zip"
      - name: Stage locked runtime wheels only
        run: python research/d061_native/stage_wheels.py "$RUNNER_TEMP/d061-product-wheels"
      - name: Stage exact reviewed fixed sources and install isolated native runtime
        run: |
          sudo --preserve-env=D061_REVIEWED_SHA "$(command -v python)" research/d061_native/stage_product.py "$CONTROL/staging.json"
          sudo --preserve-env=ImageOS,ImageVersion "$(command -v python)" /opt/d061-reviewed-source/installer.py "$RUNNER_TEMP/d061-product-wheels"
      - name: Disposable API authorization and approval plus labelled historical fixture import
        run: |
          sudo "$(command -v python)" /opt/d061-reviewed-source/product_setup.py \
            --historical-archive "$CONTROL/historical.zip" --historical-root "$CONTROL/historical" \
            --db "$CONTROL/mobius.db" --artifacts "$CONTROL/artifacts" --output "$CONTROL/setup"
      - name: Actual product execute, immutable readback and report through API
        id: product
        run: |
          sudo "$(command -v python)" /opt/d061-reviewed-source/run_product_owned.py --mode product \
            --control "$CONTROL" --product-root "$PRODUCT_ROOT" --tls-root "$TLS_ROOT"
      - name: Separate isolated untrusted-proxy-chain rejection control
        id: tls
        if: success()
        run: |
          sudo "$(command -v python)" /opt/d061-reviewed-source/run_product_owned.py --mode tls \
            --control "$CONTROL" --product-root "$PRODUCT_ROOT" --tls-root "$TLS_ROOT"
      - name: Independent identity-scoped sanitation, even after outer failure or cancellation
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 70s sudo "$(command -v python)" research/d061_native/emergency.py "$PRODUCT_ROOT/raw"
          product_rc=$?
          timeout --signal=TERM --kill-after=10s 70s sudo "$(command -v python)" research/d061_native/emergency.py "$TLS_ROOT"
          tls_rc=$?
          test "$product_rc" -eq 0 && test "$tls_rc" -eq 0
      - name: Independent final absence with stage-required launch records
        if: always()
        run: |
          set +e
          if test -f "$CONTROL/product-launch-intent.json"; then product_flag=--require-launched; else product_flag=; fi
          if test -f "$CONTROL/tls-launch-intent.json"; then tls_flag=--require-launched; else tls_flag=; fi
          sudo "$(command -v python)" research/d061_native/absence.py "$PRODUCT_ROOT/raw" "$CONTROL/product-absence.json" $product_flag
          product_rc=$?
          sudo "$(command -v python)" research/d061_native/absence.py "$TLS_ROOT" "$CONTROL/tls-absence.json" $tls_flag
          tls_rc=$?
          test "$product_rc" -eq 0 && test "$tls_rc" -eq 0
      - name: Bounded allowlisted original recovery, never raw keys or private homes
        if: always()
        run: |
          sudo "$(command -v python)" research/d061_native/product_collect.py --product-root "$PRODUCT_ROOT" \
            --tls-root "$TLS_ROOT" --control "$CONTROL" --safe "$RUNNER_TEMP/d061-product-safe"
      - name: Upload only sanitized bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d061-product-local-${{ github.run_id }}
          path: ${{ runner.temp }}/d061-product-safe/
          if-no-files-found: error
          retention-days: 7
