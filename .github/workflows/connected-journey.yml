# Connected journey smoke (verification-gap closure, advisory).
#
# Runs the full chain through the product HTTP API on the ephemeral CI
# emulator: upload -> authorization -> scan -> RECON -> model consent ->
# REAL model hypothesis via the owner-authorized free OpenCode route -> PoC
# plan referencing that real hypothesis (no seeding) -> approvals API ->
# observation-only Frida execution -> persisted evidence -> ARCHIVIST
# report -> read-back.
#
# Advisory posture (same as model-eval): pull_request on its own files plus
# manual dispatch; it never runs on pushes to main, because the model leg is
# non-deterministic and calls the free upstream route. A model failure fails
# the journey honestly - the harness is never tuned toward a pass. The
# opencode CLI and frida tooling are CI job tooling, never repo dependencies.

name: Connected journey smoke

on:
  workflow_dispatch:

concurrency:
  group: connected-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mobius, frida and opencode CI tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "frida==17.27.4" "frida-tools"
          npm install -g opencode-ai

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download pinned Allsafe lab APK
        run: |
          curl -sSfL -o allsafe.apk \
            https://github.com/t0thkr1s/allsafe/releases/download/v.1.6/allsafe.apk
          echo "d6792d6634a033f048f935f1269179d3c27b859c4c34b1e9e5b008a88375efd9  allsafe.apk" | sha256sum -c -

      - name: Download pinned frida-server
        run: |
          curl -sSfL -o frida-server-17.27.4-android-x86_64.xz \
            https://github.com/frida/frida/releases/download/17.27.4/frida-server-17.27.4-android-x86_64.xz
          echo "e30e8d8dcefa6d8b78b5b6a613b42c102d5dfa0e0e47ac7ce27590dc8f05a4db  frida-server-17.27.4-android-x86_64.xz" | sha256sum -c -
          unxz frida-server-17.27.4-android-x86_64.xz

      - name: Run connected journey smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/connected_journey_smoke.sh

      - name: Upload journey outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-journey
          path: connected-journey/
          if-no-files-found: ignore
