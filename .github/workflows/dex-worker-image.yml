name: Publish isolated DEX worker image

on:
  push:
    branches: [main]
    paths:
      - "workers/dex-image/**"
      - "src/mobius/adapters/dex.py"
      - "src/mobius/adapters/dex_payload.py"
      - "src/mobius/worker/dex_index.py"
      - "pyproject.toml"
      - ".github/workflows/dex-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mobius-dex-image-main
  cancel-in-progress: true

jobs:
  publish:
    name: Build, publish and smoke test isolated DEX image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/dex-image/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mobius-dex:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MOBIUS isolated Androguard DEX indexer

      - name: Smoke test published image with real DEX fixture
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mobius-dex
        run: |
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "input.apk"), "w") as apk:
              apk.writestr("classes.dex", open("tests/fixtures/dex/AnalysisTest.dex", "rb").read())
          PY
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --env HOME=/tmp --env TMPDIR=/tmp \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/work,readonly" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            /usr/local/bin/mobius-dex-index --input /work/input.apk \
            > "$RUNNER_TEMP/dex-index.json"
          python - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "dex-index.json")))
          assert data["schema_version"] == 1
          assert data["classes"] == ["AnalysisTest"]
          assert data["dex_coverage"][0]["status"] == "indexed"
          assert len(data["edges"]) == data["methods"]
          print("isolated DEX smoke test passed")
          PY

      - name: Publish immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mobius-dex
        run: |
          echo "### Isolated DEX worker image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure the worker with this immutable reference:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
