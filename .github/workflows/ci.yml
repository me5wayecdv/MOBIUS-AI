name: MOBIUS CI

on:
  push:
    branches: [main, "codex/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobius-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} · tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobius
          POSTGRES_PASSWORD: mobius_test_only
          POSTGRES_DB: mobius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobius -d mobius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOBIUS_TEST_PG_URL: postgresql+psycopg://mobius:mobius_test_only@localhost:5432/mobius_test
      MOBIUS_DB_URL: sqlite+pysqlite:///./ci-migrations.db
      MOBIUS_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build React Flow graph UI
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "psycopg[binary]>=3.1"
      - name: Apply SQLite migration history
        run: alembic upgrade head
      - name: Run test suite (including PostgreSQL tests)
        run: pytest
