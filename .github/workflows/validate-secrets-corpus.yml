name: Secrets worker corpus validation (no-push, allowlisted logs)

# Bounded corpus validation of the REAL secrets worker path on
# source/hash-verified, authorized PUBLIC security-training APKs (DIVA,
# Allsafe). The whole path runs through the real isolated worker: recon and
# secrets jobs are claimed by the actual runner subprocess and executed
# INSIDE digest-pinned images under the proven OCI contract
# (--network=none, --read-only, --cap-drop=ALL, no-new-privileges,
# pids/memory/cpu limits, per-job timeouts; memory bound is ENFORCED, peak
# usage is not measured). Nothing is parsed from the APKs on the host; the
# only host reads are the upload bytes and their sha256. No dynamic APK
# execution anywhere.
#
# Disclosure: stdout is PUBLIC (public repo CI logs). The validation script
# prints only an allowlisted structural summary per APK (label, pinned
# sha256, size, stage seconds, accounting counts, HTTP statuses, finding
# counts, report byte size, coverage class, bounded error_code on failure).
# No literal secret values, no candidate contents, no raw worker payloads,
# no raw worker stdout/stderr, no exception messages, no report bodies.
# Download/build tooling output is limited to public URLs, package names,
# byte counts and hash-check verdicts. No artifacts are uploaded.
#
# Publication: the only push target is an ephemeral loopback-only registry
# (127.0.0.1:5000) existing for the duration of the job so the runner's
# digest-pin contract is satisfied with a REAL resolvable manifest digest.
# No registry login, no external registry, no image publication.
#
# Triggers (both manual-gated; installing this file fires nothing):
# - workflow_dispatch (available once the file reaches the default branch).
# - pull_request types:[labeled] gated by job `if` on the ONE dedicated
#   label `corpus-validation`: applying that label requires repo write
#   access and IS the explicit reviewed gate. It runs from the PR ref with
#   NO main merge. There is deliberately NO push trigger and NO unfiltered
#   pull_request trigger: either would run corpus execution and public
#   downloads on every push to a PR, which is not authorized.
on:
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - ".github/workflows/validate-secrets-corpus.yml"
      - "scripts/validate_secrets_corpus.py"
      - "workers/recon-image/**"
      - "workers/secrets-image/**"
      - "src/mobius/worker/runner.py"
      - "src/mobius/worker/secrets_analysis.py"
      - "src/mobius/services/worker_queue.py"
      - "src/mobius/services/oci_backend.py"
      - "src/mobius/api/routes.py"
      - "src/mobius/api/config.py"
      - "src/mobius/adapters/secrets_payload.py"
      - "src/mobius/services/secrets_analysis.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-validation:
    name: Real runner/OCI corpus validation (loopback-only, allowlisted logs)
    runs-on: ubuntu-latest
    # The dedicated label is the manual gate for PR runs; dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'corpus-validation')
    # Job-level concurrency: a SKIPPED job (an unrelated label event) never
    # enters the group, so unrelated labels cannot cancel a running
    # validation. The label name is part of the group key.
    concurrency:
      group: mobius-secrets-corpus-${{ github.ref }}-${{ github.event.label.name || 'dispatch' }}
      cancel-in-progress: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record source head and file hashes (for reviewer comparison; enforces nothing)
        # This step RECORDS only. It does not and cannot bind the run to the
        # reviewed bytes. The source-identity gate is MANUAL: immediately
        # before applying the `corpus-validation` label, the reviewer compares
        # the PR head sha and the sha256 of the script and this workflow file
        # against the reviewed values by hand, and applies the label only on
        # an exact match. After the run, these logged values allow a
        # retrospective comparison against what was verified. Hashes of
        # public files only.
        run: |
          set -euo pipefail
          echo "github.sha (checkout): ${GITHUB_SHA}"
          echo "pull_request head sha: ${{ github.event.pull_request.head.sha || 'n/a (dispatch)' }}"
          sha256sum scripts/validate_secrets_corpus.py \
            .github/workflows/validate-secrets-corpus.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start ephemeral loopback-only registry (job-local, no auth, no external push)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '{}' > "$DOCKER_CONFIG/config.json"
          docker run -d --name localreg -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/v2/ >/dev/null
      - name: Build recon + secrets worker images locally (no login)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          docker build -f workers/recon-image/Dockerfile -t 127.0.0.1:5000/mobius-recon-corpus-validation:ci .
          docker build -f workers/secrets-image/Dockerfile -t 127.0.0.1:5000/mobius-secrets-corpus-validation:ci .
      - name: Push to the loopback registry and resolve REAL manifest digests
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          docker push 127.0.0.1:5000/mobius-recon-corpus-validation:ci >/dev/null
          docker push 127.0.0.1:5000/mobius-secrets-corpus-validation:ci >/dev/null
          RREF="$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/mobius-recon-corpus-validation:ci)"
          SREF="$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/mobius-secrets-corpus-validation:ci)"
          case "$RREF" in
            127.0.0.1:5000/mobius-recon-corpus-validation@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected recon RepoDigests ref shape: $RREF" >&2; exit 1 ;;
          esac
          case "$SREF" in
            127.0.0.1:5000/mobius-secrets-corpus-validation@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected secrets RepoDigests ref shape: $SREF" >&2; exit 1 ;;
          esac
          echo "RECON_IMAGE=$RREF" >> "$GITHUB_ENV"
          echo "SECRETS_IMAGE=$SREF" >> "$GITHUB_ENV"
      - name: Assert no external registry credentials exist in this job
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          test -f "$DOCKER_CONFIG/config.json"
          python3 - <<'PYEOF'
          import json, os, sys
          cfg = json.load(open(os.path.join(os.environ["DOCKER_CONFIG"], "config.json")))
          if not isinstance(cfg, dict):
              sys.exit("malformed docker config: top level is not an object")
          auths = cfg.get("auths", {})
          if not isinstance(auths, dict):
              sys.exit("malformed docker config: auths is not an object")
          # Structure only: entry keys, field names and value lengths - never values.
          for key in sorted(auths):
              entry = auths[key]
              fields = ({k: len(str(v)) for k, v in entry.items()}
                        if isinstance(entry, dict) else "<non-object>")
              print(f"auth entry key={key!r} fields={fields}")
          if cfg.get("credsStore") or cfg.get("credHelpers"):
              sys.exit("credential helpers configured; refusing")
          for key, entry in auths.items():
              if key != "127.0.0.1:5000":  # exact job-local endpoint only
                  sys.exit(f"external registry auth key present: {key}")
              if entry:
                  sys.exit(f"loopback auth entry carries credential material: fields {sorted(entry)}")
          print("no external registry credentials; loopback auth entry is empty")
          PYEOF
      - name: Fetch corpus APKs; verify pinned hashes BEFORE any extraction (stop on mismatch)
        run: |
          set -euo pipefail
          mkdir -p corpus
          # Allsafe: public open-source intentionally-vulnerable training app
          # (Apache-2.0), publisher's official GitHub release asset. Static
          # analysis only; nothing redistributed.
          curl -fSL --retry 3 --max-time 600 -o corpus/allsafe.apk \
            "https://github.com/t0thkr1s/allsafe/releases/download/v.1.6/allsafe.apk"
          echo "d6792d6634a033f048f935f1269179d3c27b859c4c34b1e9e5b008a88375efd9  corpus/allsafe.apk" | sha256sum -c -
          # DIVA (diva-beta): public security-training app (GPL-3.0). The
          # publisher's original tarball URL is gone; retrieved via the
          # Internet Archive Wayback Machine id_ capture (original bytes, no
          # rewriting; captures byte-identical 2016-06..2022). The TARBALL's
          # sha256 is verified BEFORE extraction; the APK's sha256 is
          # verified after bounded single-member extraction.
          curl -fSL --retry 3 --max-time 600 -o corpus/diva-beta.tar.gz \
            "https://web.archive.org/web/20190718092111id_/https://payatu.com/wp-content/uploads/2016/01/diva-beta.tar.gz"
          echo "b600ed7879594a941a8060fdd4de177a72b43d0b5cb327030c2265cbef8999fc  corpus/diva-beta.tar.gz" | sha256sum -c -
          python3 - <<'PYEOF'
          import hashlib, sys, tarfile
          EXPECTED_MEMBER = "diva-beta.apk"
          EXPECTED_SHA256 = "5cefc51fce9bd760b92ab2340477f4dda84b4ae0c5d04a8c9493e4fe34fab7c5"
          MAX_BYTES = 64 * 1024 * 1024
          try:
              tf = tarfile.open("corpus/diva-beta.tar.gz", "r:gz")
          except (tarfile.TarError, OSError):
              sys.exit("archive unreadable (detail withheld)")
          with tf:
              members = tf.getmembers()
              # Exactly one expected regular-file member; nothing else is
              # touched: no symlink/hardlink/device extraction, no path
              # traversal (extractfile on the exact member only), bounded
              # decompressed size (no expansion bomb).
              if len(members) != 1 or members[0].name != EXPECTED_MEMBER:
                  sys.exit(f"unexpected archive membership: count={len(members)}")
              member = members[0]
              if not member.isreg():
                  sys.exit("archive member is not a regular file")
              if not 0 < member.size <= MAX_BYTES:
                  sys.exit("archive member size outside bound")
              src = tf.extractfile(member)
              if src is None:
                  sys.exit("archive member unreadable")
              data = src.read(MAX_BYTES + 1)
              if len(data) > MAX_BYTES or len(data) != member.size:
                  sys.exit("archive member size mismatch or over bound")
          if hashlib.sha256(data).hexdigest() != EXPECTED_SHA256:
              sys.exit("diva-beta.apk sha256 mismatch; stopping")
          with open("corpus/diva-beta.apk", "wb") as out:
              out.write(data)
          print(f"diva-beta.apk extracted and verified: {len(data)} bytes")
          PYEOF
          # Structural only: byte sizes, never content.
          wc -c corpus/allsafe.apk corpus/diva-beta.apk
      - name: Run real-runner corpus validation (recon + secrets, containerized)
        env:
          PYTHONPATH: src
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          DOCKER_PATH="$(command -v docker)"
          test -x "$DOCKER_PATH"
          python scripts/validate_secrets_corpus.py \
            --recon-image "$RECON_IMAGE" \
            --secrets-image "$SECRETS_IMAGE" \
            --apk "allsafe=corpus/allsafe.apk=infosecadventures.allsafe" \
            --apk "diva-beta=corpus/diva-beta.apk=jakhar.aseem.diva"
