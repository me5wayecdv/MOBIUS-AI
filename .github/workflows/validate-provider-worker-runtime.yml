name: Provider worker runtime validation (no-push, read-only)

# Read-only validation workflow. Builds the provider worker image LOCALLY and
# exercises the real runner/OCI path and output contract on fixed in-repo
# fixtures via scripts/validate_provider_runtime.py. Nothing is published:
# the only push target is an ephemeral loopback-only registry (127.0.0.1:5000)
# that exists for the duration of the job so the runner's digest-pin contract
# can be satisfied with a REAL resolvable manifest digest. There is no
# registry login and no external registry anywhere in this workflow.
#
# Triggered on pull_request so validation runs from the PR ref WITHOUT
# requiring the branch to be merged to the default branch first (a
# workflow_dispatch-only workflow would have to exist on the default branch
# before it could run). workflow_dispatch stays available once merged.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobius-provider-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-integration:
    # Postgres worker-queue tests on the alembic-migrated schema. Separate
    # minimal job; the existing CI workflow and all publication workflows are
    # untouched.
    name: Postgres worker-queue integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobius
          POSTGRES_PASSWORD: mobius_test_only
          POSTGRES_DB: mobius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobius -d mobius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOBIUS_TEST_PG_DSN: postgresql+psycopg://mobius:mobius_test_only@localhost:5432/mobius_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "psycopg[binary]>=3.1"
      - name: Postgres worker-queue tests (alembic-migrated schema)
        run: python -m pytest tests/test_worker_queue_pg.py -v --junitxml=pg-junit.xml
      - name: Assert PG tests actually executed (no false-green skips)
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET
          suites = ET.parse("pg-junit.xml").getroot().iter("testsuite")
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          print(f"pg tests={tests} skipped={skipped} failures={failures} errors={errors}")
          assert tests >= 6, f"expected >= 6 executed PG tests, got {tests}"
          assert skipped == 0, f"PG tests were skipped: {skipped}"
          assert failures == 0 and errors == 0
          PYEOF

  provider-runtime:
    name: Provider image build + real runner/OCI validation (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-local, credential-less docker config (step-level env: the runner
    # context is not valid in job-level env). The ambient runner config is
    # never read, used, or modified by this job. Initialized empty before the
    # first docker command; subprocesses (the validation script and the worker
    # runner it launches) inherit it through the environment.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "psycopg[binary]>=3.1"
      - name: Start ephemeral loopback-only registry (job-local, no auth, no external push)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '{}' > "$DOCKER_CONFIG/config.json"
          docker run -d --name localreg -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/v2/ >/dev/null
      - name: Build provider worker image locally (no login)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          docker build -f workers/provider-image/Dockerfile -t 127.0.0.1:5000/mobius-provider-validation:ci .
      - name: Push to the loopback registry and resolve the REAL manifest digest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          docker push 127.0.0.1:5000/mobius-provider-validation:ci >/dev/null
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' 127.0.0.1:5000/mobius-provider-validation:ci)"
          echo "resolved ref: $REF"
          case "$REF" in
            127.0.0.1:5000/mobius-provider-validation@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected RepoDigests ref shape: $REF" >&2; exit 1 ;;
          esac
          DIGEST="${REF##*@sha256:}"
          test "${#DIGEST}" -eq 64
          echo "PROVIDER_IMAGE=$REF" >> "$GITHUB_ENV"
      - name: Assert no external registry credentials exist in this job
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          test -f "$DOCKER_CONFIG/config.json"
          python3 - <<'PYEOF'
          import json, os, sys
          cfg = json.load(open(os.path.join(os.environ["DOCKER_CONFIG"], "config.json")))
          if not isinstance(cfg, dict):
              sys.exit("malformed docker config: top level is not an object")
          auths = cfg.get("auths", {})
          if not isinstance(auths, dict):
              sys.exit("malformed docker config: auths is not an object")
          # Structure only: entry keys, field names and value lengths - never values.
          for key in sorted(auths):
              entry = auths[key]
              fields = ({k: len(str(v)) for k, v in entry.items()}
                        if isinstance(entry, dict) else "<non-object>")
              print(f"auth entry key={key!r} fields={fields}")
          if cfg.get("credsStore") or cfg.get("credHelpers"):
              sys.exit("credential helpers configured; refusing")
          for key, entry in auths.items():
              if key != "127.0.0.1:5000":  # exact job-local endpoint only
                  sys.exit(f"external registry auth key present: {key}")
              if entry:
                  sys.exit(f"loopback auth entry carries credential material: fields {sorted(entry)}")
          print("no external registry credentials; loopback auth entry is empty")
          PYEOF
      - name: Run real-runner runtime validation on fixed fixtures
        env:
          PYTHONPATH: src
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-isolated
        run: |
          set -euo pipefail
          DOCKER_PATH="$(command -v docker)"
          test -x "$DOCKER_PATH"
          python scripts/validate_provider_runtime.py \
            --image "$PROVIDER_IMAGE" \
            --runtime-path "$DOCKER_PATH" \
            --timeout-seconds 540
