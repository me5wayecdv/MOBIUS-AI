name: Manual-only publish isolated JADX worker image

on:
  workflow_dispatch:
    inputs:
      owner_approval:
        description: "Type APPROVED only after explicit project-owner approval to publish this image."
        required: true
        type: string
      approval_reference:
        description: "Reference or short note recording the project-owner decision."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.owner_approval == 'APPROVED' && inputs.approval_reference != '' }}
    name: Publish approved JADX image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (manual workflow only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/jadx-image/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mobius-jadx:sha-${{ github.sha }}
          build-args: |
            JADX_VERSION=1.5.6
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MOBIUS isolated JADX decompiler

      - name: Smoke test the published image by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mobius-jadx
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/jadx-image-smoke"
          mkdir -p "$smoke_root"
          chown 65532:65532 "$smoke_root"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --pids-limit 128 --memory 4096m --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --mount "type=bind,src=$smoke_root,dst=/work,rw" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            python /opt/mobius/scripts/smoke_jadx_image.py \
              --fixture /opt/mobius/tests/fixtures/dex/AnalysisTest.dex \
              --workspace-root /work/workspaces \
              --cache-root /work/cache \
              --result /work/smoke-result.json
          {
            echo "### Published JADX worker image"
            echo
            echo "Owner approval reference: ${{ inputs.approval_reference }}"
            echo
            printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
